name: PHCRemoteControl
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  PHCRemoteControl:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PHCRemoteControl
        PRODUCT_NAME: PHC Remote
        PRODUCT_MODULE_NAME: PHCRemoteControl
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO

  PHCRemoteControlTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PHCRemoteControlTests
      - path: protocol-fixtures/project
        buildPhase: resources
      - path: protocol-fixtures/commands
        buildPhase: resources
    dependencies:
      - target: PHCRemoteControl
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PHC Remote.app/PHC Remote"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PHCRemoteControl:
    build:
      targets:
        PHCRemoteControl: all
    run:
      config: Debug
    test:
      targets:
        - PHCRemoteControlTests
    archive:
      config: Release
